* { box-sizing: border-box; }
html { font-size: 100%; }
body.presenter { font-size: 125%; }
body {
  margin: 0; background: var(--bg) var(--snow); color: var(--text);
  font-family: var(--font); font-size: 1rem; line-height: 1.55; font-weight: 400;
  padding-bottom: calc(var(--footer-h) + 28px);
}
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 1em; }
.muted { color: var(--text2); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1:focus { outline: none; }

.skip { position: absolute; left: 12px; top: -60px; background: var(--accent); color: var(--on-accent); padding: 8px 14px; border-radius: 8px; z-index: 50; }
.skip:focus { top: 8px; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 20; background: var(--hdr-bg) var(--snow); color: var(--hdr-text);
  border-bottom: 3px solid var(--gold);
}
.deco { display: flex; gap: 10px; margin-bottom: 8px; color: var(--gold); }
.deco svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.deco svg:nth-child(2) { width: 18px; height: 18px; margin-top: 6px; }
.ready .deco { justify-content: center; }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; margin-right: auto; display: flex; align-items: center; }
.logo { height: 48px; width: auto; max-width: 100%; display: block; }
.tools { display: flex; gap: 8px; }
.steps { list-style: none; display: flex; gap: 6px; margin: 0; padding: 0; order: 2; flex: 1 1 360px; }
.steps li { flex: 1; }
.step-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 10px; border: 1px solid var(--hdr-line); border-radius: 999px;
  background: transparent; color: var(--hdr-text2); font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
}
.step-btn .num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--hdr-num); color: var(--hdr-text); font-size: .8rem; }
.step-btn[aria-current="step"] { background: var(--hdr-on); border-color: var(--hdr-on); color: var(--hdr-on-text); }
.step-btn[aria-current="step"] .num { background: var(--hdr-on-text); color: var(--hdr-on); }
header.top .icon-btn { background: transparent; color: var(--hdr-text); border-color: var(--hdr-line); }
header.top :focus-visible { outline-color: #FFFFFF; }
header.top .icon-btn:hover, header.top .step-btn:hover { border-color: #FFFFFF; }

.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover, .step-btn:hover { border-color: var(--accent); }

/* Layout */
main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 8px; }
.screen { animation: rise .45s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.lead { font-size: 1.15rem; max-width: 62ch; color: var(--text2); }
.demo-note { background: var(--demo-bg); color: var(--demo-text); border: 1px solid var(--demo-line); border-radius: 12px; padding: 12px 16px; margin: 0 0 20px; font-weight: 500; }
.badge { display: inline-block; background: var(--demo-text); color: var(--demo-bg); border-radius: 6px; padding: 1px 8px; font-size: .8rem; font-weight: 700; margin-right: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin: 20px 0 28px; }
.sub-card { display: grid; grid-template-rows: subgrid; grid-row: span 2; row-gap: 6px; }
.sub-card h3, .sub-card p { margin: 0; }
.stagger > * { animation: rise .5s ease both; animation-delay: calc(var(--i, 0) * 90ms); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
  padding: 10px 22px; border-radius: 12px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; cursor: pointer;
}
.btn.secondary { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }

/* Question + collect screen */
.statement { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
.qbox { background: var(--accent-soft); border-radius: var(--radius); padding: 18px 22px; margin: 8px 0 28px; border-left: 6px solid var(--gold); }
.qlabel { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); }
.qtext { font-size: clamp(1.5rem, 3.6vw, 2.2rem); font-weight: 800; line-height: 1.2; color: var(--text); }
.qtext-small { font-weight: 600; margin-bottom: 8px; }
.addbox { margin: 16px 0 24px; display: grid; gap: 8px; }
.field { font-weight: 700; }
.addrow { display: flex; gap: 12px; flex-wrap: wrap; }
.inp { flex: 1 1 260px; min-height: 52px; padding: 10px 14px; font: inherit; font-size: 1.1rem; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--text); }
.hint { font-size: .9rem; color: var(--text2); }
.total { font-weight: 600; color: var(--text2); min-height: 1.5em; margin: 0 0 8px; }
.chips { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 16px; max-width: 100%; }
.chip .cw { font-weight: 700; overflow-wrap: anywhere; }
.chip .cn { background: var(--accent-soft); color: var(--text); border-radius: 99px; padding: 0 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mini { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 1.2rem; font-weight: 700; cursor: pointer; }
.mini:hover { border-color: var(--accent); }
.cloudcard { padding: 28px 20px; }
.cloud { font-size: 1rem; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .3em 1.1em; min-height: 280px; align-content: center; line-height: 1.1; }
.cloud .w { font-weight: 800; overflow-wrap: anywhere; text-align: center; animation: pop .6s ease both; }
.cloud .c0 { color: var(--w0); } .cloud .c1 { color: var(--w1); } .cloud .c2 { color: var(--w2); } .cloud .c3 { color: var(--w3); }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
/* Moderator view: input on the left, live cloud on the right */
.modtag { display: inline-block; background: var(--accent-soft); color: var(--text); border: 1px solid var(--gold); border-radius: 6px; padding: 0 8px; font-size: .85rem; font-weight: 700; }
.collect-grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; margin-bottom: 8px; }
.collect-right { position: sticky; top: 96px; }
.collect-right h2, .collect-left h2 { margin-top: 0; }
.livecard { padding: 12px; }
.livecloud { min-height: 300px; }
.live-empty { margin: 0; text-align: center; font-size: 1.05rem; }
.aud { display: grid; gap: 6px; margin-top: 14px; justify-items: start; }
.aud .hint { margin: 0; }
.cloud.livecloud .w { animation: none; position: relative; }
.cloud.livecloud .w.fly { animation: fly .9s cubic-bezier(.2,.8,.2,1) both; }
.cloud.livecloud .w.bump { animation: bump .6s ease both; }
@keyframes fly {
  0% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4) rotate(-8deg); }
  60% { opacity: 1; transform: translate(0, 0) scale(1.15) rotate(0); }
  100% { opacity: 1; transform: none; }
}
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.star { position: absolute; top: -.55em; right: -.7em; width: .9em; height: .9em; color: var(--gold); pointer-events: none; animation: starpop 1.6s ease-out both; animation-delay: .35s; opacity: 0; }
.star svg { width: 100%; height: 100%; fill: currentColor; stroke: none; filter: drop-shadow(0 0 4px rgba(217,174,60,.7)); }
@keyframes starpop {
  0% { opacity: 0; transform: scale(0) rotate(-40deg); }
  22% { opacity: 1; transform: scale(1.5) rotate(10deg); }
  45% { opacity: 1; transform: scale(1) rotate(0); }
  100% { opacity: 0; transform: translateY(-.5em) scale(.8); }
}
/* Audience window: cloud only, big */
body.audience { padding-bottom: 24px; }
.audience main { max-width: 1400px; }
.audience .audience-q { text-align: center; font-size: clamp(1.8rem, 5vw, 3.2rem); margin-bottom: 20px; }
.audience .deco { justify-content: center; }
.audience .cloudcard { padding: 28px; }
.audience .cloud { font-size: 1.6rem; min-height: 58vh; }
.audience .demo-note { text-align: center; }
.toplist { margin: 8px 0 0; padding-left: 1.3em; font-size: 1.15rem; }
.toplist li { margin-bottom: .4em; }

/* Ready + results */
.ready { text-align: center; padding: 40px 16px; max-width: 640px; margin: 0 auto; }
.ready .btn { min-height: 60px; font-size: 1.2rem; padding: 14px 36px; }
.result-list { display: grid; gap: 16px; margin: 20px 0 28px; }
.res h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.res .avg { font-size: 2rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.bar { height: 22px; border-radius: 99px; background: var(--track); overflow: hidden; margin: 10px 0; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
.axis { display: flex; justify-content: space-between; font-size: .85rem; color: var(--text2); }
.dist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; font-size: .85rem; color: var(--text2); text-align: center; }
.dist b { display: block; font-size: 1.15rem; color: var(--text); }
.pair { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin: 20px 0; }
.pair .tag { font-size: .85rem; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.prompts { padding-left: 1.2em; }
.prompts li { margin-bottom: .6em; }
.disclaimer { border-left: 4px solid var(--accent); padding: 8px 16px; background: var(--surface2); border-radius: 0 12px 12px 0; margin: 20px 0; }

/* Footer */
footer.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); }
.foot-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .85rem; color: var(--text2); }

/* Settings dialog */
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(5, 15, 28, .6); }
.dlg { padding: 20px; display: grid; gap: 16px; max-height: 85vh; overflow: auto; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; }
.dlg-head h2 { margin: 0; }
.field { display: grid; gap: 6px; font-weight: 600; }
.field select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); min-height: 44px; }
.check { display: flex; align-items: center; gap: 12px; font-weight: 600; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.keys dt { font-weight: 700; }
.keys dd { margin: 0; color: var(--text2); }
kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 7px; background: var(--surface2); color: var(--text); }

#print { display: none; }

@media (max-width: 960px) {
  .collect-grid { grid-template-columns: minmax(0, 1fr); }
  .collect-right { position: static; order: -1; }
}
@media (max-width: 720px) {
  .logo { height: 36px; }
  .audience .cloud { font-size: 1rem; }
  .cloud { font-size: .72rem; min-height: 220px; }
  .step-btn .lbl { display: none; }
  .steps { flex-basis: 100%; }
  .foot-in { font-size: .8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .star { display: none; }
}
@media print {
  body { background: #fff; background-image: none; color: #000; padding: 0; font-size: 11pt; }
  header.top, footer.bottom, main, dialog, .skip { display: none !important; }
  #print { display: block; }
  #print h1 { font-size: 20pt; }
  #print table { width: 100%; border-collapse: collapse; margin: 12pt 0; }
  #print th, #print td { border: 1px solid #555; padding: 6pt 8pt; text-align: left; vertical-align: top; }
  #print { background: #fff; }
  #print .pq { font-size: 15pt; font-weight: 700; }
  #print .cloud { min-height: 0; margin: 14pt 0; }
  #print .cloud .w, #print .cloud .w.c0, #print .cloud .w.c1, #print .cloud .w.c2, #print .cloud .w.c3 { color: #000; animation: none; }
  #print .demo-note { background: #fff; color: #000; border: 1px solid #000; }
  #print .disclaimer { background: #fff; border-left: 3px solid #000; color: #000; }
}

/* ===== Retro board ===== */
.pmain.wide { max-width: 980px; }
main.wide { max-width: 1280px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lead.tight { margin: 0 0 12px; font-size: 1.05rem; }
.cnt { display: inline-block; margin-left: 10px; background: var(--accent-soft); color: var(--text); border-radius: 99px; padding: 0 10px; font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums; vertical-align: middle; }

/* picture with signs and stickers. The picture is always light, so sticker colours are fixed. */
.board { position: relative; margin: 0 0 20px; container-type: inline-size; border-radius: var(--radius); overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); line-height: 0; }
.board-img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.zone { position: absolute; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); gap: 1.1cqw; pointer-events: none; line-height: 1.15; }
.hot { position: absolute; display: block; padding: 0; margin: 0; background: transparent; border: .45cqw solid transparent; border-radius: 1.4cqw; line-height: 0; }
button.hot { cursor: pointer; }
button.hot:hover { background: rgba(26, 98, 168, .08); }
button.hot:focus-visible { outline: 3px solid #1A62A8; outline-offset: 2px; }
.hot.z1[aria-pressed="true"] { border-color: #1B6B3F; background: rgba(27, 107, 63, .12); box-shadow: 0 0 0 .5cqw rgba(27, 107, 63, .25); }
.hot.z2[aria-pressed="true"] { border-color: #B01E32; background: rgba(176, 30, 50, .10); box-shadow: 0 0 0 .5cqw rgba(176, 30, 50, .22); }
.hot.z3[aria-pressed="true"] { border-color: #A87900; background: rgba(217, 174, 60, .18); box-shadow: 0 0 0 .5cqw rgba(217, 174, 60, .35); }
.stk { position: relative; display: flex; align-items: center; justify-content: center; padding: .55cqw .7cqw; border-radius: .55cqw; color: #0B2A4A; font-weight: 600; font-size: 1.08cqw; text-align: center; transform: rotate(var(--r, 0deg)); box-shadow: 0 .25cqw .7cqw rgba(11, 42, 74, .35); min-width: 0; }
.stk.z1 { background: #CDEBD8; } .stk.z2 { background: #F8CFD5; } .stk.z3 { background: #FBE7A8; }
.stk.more { font-weight: 800; transform: none; box-shadow: none; border: .2cqw dashed rgba(11, 42, 74, .5); }
.stk-t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; line-height: 1.18; }
.stk.new { animation: stkin .8s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes stkin { 0% { opacity: 0; transform: translateY(-6cqw) scale(.4) rotate(-14deg); } 60% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1.18); } 100% { opacity: 1; transform: rotate(var(--r, 0deg)); } }
.stk .star { top: -1.3cqw; right: -1.3cqw; width: 2.8cqw; height: 2.8cqw; }
@container (max-width: 560px) { .stk-t { display: none; } .stk { min-height: 3cqw; } .stk.more .stk-t { display: block; font-size: 3cqw; } .stk.more { font-size: 3cqw; } }

/* question buttons */
.qsel { display: grid; gap: 10px; margin: 0 0 16px; }
.qbtn { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; text-align: left; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
.qbtn:hover { border-color: var(--accent); }
.qbtn[aria-pressed="true"] { border-color: var(--text); background: var(--accent-soft); box-shadow: var(--shadow); }
.qbtn-text { display: grid; }
.qbtn-q { font-weight: 800; }
.qbtn-n { font-size: .85rem; color: var(--text2); font-variant-numeric: tabular-nums; }
.qdot { flex: none; display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-right: 8px; }
.qbtn .qdot { margin-right: 0; }
.z1 > .qdot, .qbtn.z1 .qdot, .qcol.z1 .qdot { background: #1B6B3F; }
.z2 > .qdot, .qbtn.z2 .qdot, .qcol.z2 .qdot { background: #B01E32; }
.z3 > .qdot, .qbtn.z3 .qdot, .qcol.z3 .qdot { background: #D9AE3C; }
.sendcard { margin-bottom: 20px; }
.sendcard .msg { margin: 10px 0 0; }

/* lists of notes */
.notes { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 8px; }
.note { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 10px; border-left: 8px solid; color: #0B2A4A; font-weight: 600; overflow-wrap: anywhere; }
.note.z1 { background: #CDEBD8; border-color: #1B6B3F; } .note.z2 { background: #F8CFD5; border-color: #B01E32; } .note.z3 { background: #FBE7A8; border-color: #A87900; }
.note.za { background: var(--surface); color: var(--text); border-color: var(--accent); border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.notes li.muted { color: var(--text2); }
.note .mini { flex: none; background: rgba(255, 255, 255, .7); color: #0B2A4A; border-color: rgba(11, 42, 74, .35); }
.note.za .mini { background: var(--surface); color: var(--text); border-color: var(--line); }
.note.new { animation: rise .5s ease both; }
.qcols { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.qcol h3 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.addown { margin-bottom: 14px; }
.recap { margin-top: 24px; }
.recap summary { cursor: pointer; font-weight: 800; font-size: 1.1rem; padding: 8px 0; }
.recap[open] summary { margin-bottom: 12px; }
@media (max-width: 960px) { .qcols { grid-template-columns: minmax(0, 1fr); } }
@media print {
  #print ul { margin: 4pt 0 10pt; padding-left: 1.2em; }
  #print li { margin-bottom: 3pt; }
  #print h2 { font-size: 13pt; margin: 14pt 0 4pt; }
}

/* ===== v1.4: participant + moderator pages ===== */
.pmain { max-width: 680px; }
.msg { min-height: 1.6em; margin: 0 0 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.msg.err { color: var(--w3); }
.msg.ok { color: var(--text); }
.msg.info { color: var(--text2); }
.thanks-star { width: 1.4em; height: 1.4em; color: var(--gold); animation: starpop 1.6s ease-out both; flex: none; }
.thanks-star svg { width: 100%; height: 100%; fill: currentColor; stroke: none; }
.hint.err { color: var(--w3); font-weight: 600; }
.qbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
.qh { margin: 0; font-size: clamp(1.4rem, 3vw, 2.2rem); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.toolbar .btn { min-height: 44px; padding: 8px 16px; font-size: .95rem; }
.toolbar .btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chipstatus { border-radius: 99px; padding: 6px 14px; font-weight: 700; font-size: .9rem; border: 1px solid var(--line); }
.chipstatus.good { background: var(--accent-soft); color: var(--text); }
.chipstatus.warn { background: var(--demo-bg); color: var(--demo-text); border-color: var(--demo-line); }
.closed-note { background: var(--demo-bg); color: var(--demo-text); border: 1px solid var(--demo-line); border-radius: 12px; padding: 10px 16px; font-weight: 600; }
.modscreen { max-width: none; }
.modgrid { display: grid; gap: 24px; grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr); align-items: start; }
.modgrid.cloud-only { grid-template-columns: minmax(0, 1fr); }
.modgrid.cloud-only .modpanel { display: none; }
.modcloud .livecloud { min-height: 56vh; font-size: 1.25rem; }
.joinbar { margin-bottom: 16px; }
.joinurl { font-size: 1.15rem; font-weight: 800; overflow-wrap: anywhere; color: var(--accent); }
.modpanel h2 { margin-top: 0; }
.modpanel .chips { max-height: 40vh; overflow: auto; }
.chip .mini { flex: none; }
@media (max-width: 960px) { .modgrid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .modcloud .livecloud { font-size: .8rem; min-height: 40vh; } }
@media print { #print .cloud { font-size: 1rem; } }

</style>

  startOverConfirm: ["Alle Sticker und Maßnahmen löschen und mit Schritt 1 neu beginnen?"],
  removeConfirm: ["Diesen Eintrag entfernen?"],
  removeAria: ["Eintrag entfernen: {t}"],
  stickersTitle: ["Sticker"],
  actionsTitle: ["Maßnahmen"],
  recapTitle: ["Rückblick auf die Sticker"],
  noneYet: ["Noch nichts da."],
  countN: ["{n}"],

  addBtn: ["Ergänzen"],

<script>
/* common.js - shared helpers for the participant and the moderator page. */
var RT = (function () {
  'use strict';
  var THEME_KEY = 'rt_theme', DEV_KEY = 'rt_dev';

  function t(k, vars) {
    var v = STR[k]; var s = v ? v[0] : k;
    if (vars) for (var p in vars) s = s.split('{' + p + '}').join(String(vars[p]));
    return s;
  }
  /* All DOM is built with textContent, so user text is never interpreted as HTML. */
  function h(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function reduced() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  function svg(path) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
    path.forEach(function (d) { var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.appendChild(p); });
    return s;
  }
  var ICON = {
    star: ['M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.2 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z'],
    theme: ['M12 3a9 9 0 100 18 9 9 0 000-18z', 'M12 3v18']
  };
  function clean(s, max) {
    return String(s == null ? '' : s).replace(/[\u0000-\u001F\u007F<>]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max).trim();
  }
  function hashOf(s) { var x = 5381; for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return Math.abs(x); }
  function qOf(k) { for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].k === k) return QUESTIONS[i]; return null; }

  /* Turns the list from the server into { q1: [], q2: [], q3: [], act: [] }. Anything unexpected is dropped. */
  function group(arr) {
    var by = { q1: [], q2: [], q3: [], act: [] };
    if (!Array.isArray(arr)) return by;
    arr.forEach(function (x) {
      if (!x || typeof x !== 'object' || !by[x.k]) return;
      var id = Number(x.id); var txt = clean(x.t, x.k === 'act' ? LIMITS.action : LIMITS.sticker);
      if (!isFinite(id) || !txt) return;
      by[x.k].push({ id: id, k: x.k, t: txt });
    });
    return by;
  }

  /* ---------- theme ---------- */
  function applyTheme(v) {
    var r = document.documentElement;
    if (v === 'light' || v === 'dark') r.setAttribute('data-theme', v); else r.removeAttribute('data-theme');
    try { if (v === 'light' || v === 'dark') localStorage.setItem(THEME_KEY, v); else localStorage.removeItem(THEME_KEY); } catch (e) { }
  }
  function isDark() {
    var a = document.documentElement.getAttribute('data-theme');
    return a === 'dark' || (a !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function initTheme() { try { var th = localStorage.getItem(THEME_KEY); if (th === 'light' || th === 'dark') applyTheme(th); } catch (e) { } }
  function themeBtn() { return h('button', { class: 'icon-btn', type: 'button', 'aria-label': t('themeToggle'), onclick: function () { applyTheme(isDark() ? 'light' : 'dark'); } }, [svg(ICON.theme)]); }

  /* ---------- page frame ---------- */
  function headerEl(extra) {
    return h('header', { class: 'top' }, [h('div', { class: 'top-in' }, [
      h('div', { class: 'brand', text: t('appName') }), h('div', { class: 'tools' }, (extra || []).concat([themeBtn()]))])]);
  }
  function footerEl() {
    return h('footer', { class: 'bottom' }, [h('div', { class: 'foot-in' }, [h('span', { text: t('footerTxt') }), h('span', { text: 'v' + APP.version })])]);
  }
  function syncFooter() {
    var f = document.querySelector('footer.bottom');
    if (f) document.documentElement.style.setProperty('--footer-h', f.offsetHeight + 'px');
  }

  /* ---------- device id (anonymous, only used for the per-device limits) ---------- */
  function deviceId() {
    var id = '';
    try { id = localStorage.getItem(DEV_KEY) || ''; } catch (e) { }
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(id)) {
      var a = new Uint8Array(12);
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (var i = 0; i < 12; i++) a[i] = Math.floor(Math.random() * 256);
      id = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      try { localStorage.setItem(DEV_KEY, id); } catch (e) { }
    }
    return id;
  }

  /* ---------- network layer: Supabase (functions from supabase-retro.sql) ---------- */
  var net = (function () {
    var C = (typeof CONFIG !== 'undefined' && CONFIG) || {};
    var base = String(C.sbUrl || '').replace(/\/+$/, ''), key = String(C.sbKey || '');
    function rpc(name, args) {
      var headers = { 'Content-Type': 'application/json', 'apikey': key };
      if (key.indexOf('eyJ') === 0) headers['Authorization'] = 'Bearer ' + key;
      return fetch(base + '/rest/v1/rpc/' + name, { method: 'POST', headers: headers, body: JSON.stringify(args || {}), cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
    }
    return {
      configured: function () { return !!(base && key); },
      state: function () { return rpc('rt_state'); },
      submit: function (dev, k, text) { return rpc('rt_submit', { p_device: dev, p_kind: k, p_t: text }); },
      mine: function (dev) { return rpc('rt_mine', { p_device: dev }); },
      list: function (pin, rev) { return rpc('rt_list', { p_pin: pin, p_rev: rev }); },
      add: function (pin, k, text) { return rpc('rt_add', { p_pin: pin, p_kind: k, p_t: text }); },
      remove: function (pin, id) { return rpc('rt_remove', { p_pin: pin, p_id: id }); },
      phase: function (pin, p) { return rpc('rt_phase', { p_pin: pin, p_phase: p }); },
      reset: function (pin) { return rpc('rt_reset', { p_pin: pin }); }
    };
  })();

  /* ---------- the picture with the three signs and the stickers ---------- */
  function board(opts) {
    var fig = h('figure', { class: 'board' });
    fig.appendChild(h('img', { class: 'board-img', src: BOARD_SRC, alt: t('boardAlt'), draggable: 'false' }));
    var layers = {}, hots = {};
    function box(e, r) { e.style.left = r.x + '%'; e.style.top = r.y + '%'; e.style.width = r.w + '%'; e.style.height = r.h + '%'; }
    QUESTIONS.forEach(function (q) {
      var z = ZONES[q.k];
      var layer = h('div', { class: 'zone ' + q.cls, 'aria-hidden': 'true' });
      box(layer, z); layer.style.setProperty('--cols', z.cols); layer.style.setProperty('--rows', z.rows);
      fig.appendChild(layer); layers[q.k] = layer;
      var hot = opts.interactive
        ? h('button', { class: 'hot ' + q.cls, type: 'button', 'aria-label': q.text, 'aria-pressed': 'false', onclick: function () { opts.onPick(q.k); } })
        : h('span', { class: 'hot ' + q.cls, 'aria-hidden': 'true' });
      box(hot, HOTS[q.k]); fig.appendChild(hot); hots[q.k] = hot;
    });
    function select(k) {
      QUESTIONS.forEach(function (q) { if (hots[q.k].tagName === 'BUTTON') hots[q.k].setAttribute('aria-pressed', q.k === k ? 'true' : 'false'); });
    }
    /* by = grouped items, fresh = { id: true } for items that just arrived (they pop in with a star) */
    function update(by, fresh) {
      QUESTIONS.forEach(function (q) {
        var z = ZONES[q.k], layer = layers[q.k], list = by[q.k] || [], slots = z.cols * z.rows;
        var over = list.length > slots, show = over ? slots - 1 : list.length;
        layer.textContent = '';
        for (var i = 0; i < show; i++) {
          var it = list[i], isNew = !!(fresh && fresh[it.id]);
          var cell = h('span', { class: 'stk ' + q.cls + (isNew ? ' new' : '') }, [h('span', { class: 'stk-t', text: it.t })]);
          cell.style.setProperty('--r', ((hashOf(String(it.id)) % 9) - 4) + 'deg');
          if (isNew && !reduced()) {
            var star = h('span', { class: 'star', 'aria-hidden': 'true' }, [svg(ICON.star)]);
            cell.appendChild(star);
            (function (s) { var rm = function () { if (s.parentNode) s.parentNode.removeChild(s); }; s.addEventListener('animationend', rm); setTimeout(rm, 2200); })(star);
          }
          layer.appendChild(cell);
        }
        if (over) layer.appendChild(h('span', { class: 'stk more ' + q.cls }, [h('span', { class: 'stk-t', text: t('boardNoteMore', { n: list.length - show }) })]));
      });
    }
    if (opts.selected) select(opts.selected);
    return { el: fig, update: update, select: select };
  }

  /* ---------- small self test (run in the console: RT.selfTest()) ---------- */
  function selfTest() {
    var res = [], fails = 0;
    function ok(n, c) { res.push((c ? 'PASS ' : 'FAIL ') + n); if (!c) fails++; }
    ok('clean cuts to limit', clean(new Array(300).join('a'), 80).length === 80);
    ok('clean removes brackets and control chars', clean('<b>Hi\u0007</b>', 80).indexOf('<') === -1 && clean('a\u0000b', 80) === 'a b');
    ok('clean keeps normal text', clean('  Mehr   Austausch  ', 80) === 'Mehr Austausch');
    var g = group([{ id: 1, k: 'q1', t: 'ok' }, { id: 2, k: 'zz', t: 'bad key' }, null, 'x', { id: 'a', k: 'q2', t: 'bad id' }, { id: 3, k: 'act', t: '<i>x</i>' }]);
    ok('group drops bad entries', g.q1.length === 1 && g.q2.length === 0 && g.act.length === 1 && g.act[0].t.indexOf('<') === -1);
    ok('group of junk is empty', group('junk').q1.length === 0 && group(undefined).act.length === 0);
    var txt = true; for (var k in STR) { if (!STR[k] || typeof STR[k][0] !== 'string') txt = false; }
    ok('all strings defined', txt);
    ok('zones and signs inside the picture', QUESTIONS.every(function (q) { var z = ZONES[q.k], s = HOTS[q.k]; return z.x + z.w <= 100 && z.y + z.h <= 100 && s.x + s.w <= 100 && s.y + s.h <= 100; }));
    var out = (fails ? 'SELFTEST FAILED: ' + fails : 'SELFTEST OK: ' + res.length + ' checks') + '\n' + res.join('\n');
    if (window.console) console.log(out);
    return { failed: fails, results: res };
  }

  return { t: t, h: h, $: $, svg: svg, ICON: ICON, reduced: reduced, clean: clean, hashOf: hashOf, qOf: qOf, group: group,
    initTheme: initTheme, headerEl: headerEl, footerEl: footerEl, syncFooter: syncFooter, deviceId: deviceId, net: net, board: board, selfTest: selfTest };
})();

</script>
<script>
/* moderator.js - the page for the moderator: live picture with stickers, step switch, actions. */
(function () {
  'use strict';
  var t = RT.t, h = RT.h, $ = RT.$, net = RT.net;
  var POLL_MS = 2000;
  var pin = '', timer = null;
  var S = { phase: 'stickers', rev: -1, by: { q1: [], q2: [], q3: [], act: [] }, known: null, connected: false };
  var bd = null;

  /* ---------- server calls ---------- */
  function poll() {
    clearTimeout(timer);
    net.list(pin, S.rev)
      .then(function (j) {
        if (j && j.error === 'pin') { stop(); showConnect('pinWrong'); return; }
        if (!j || typeof j !== 'object') throw new Error('bad');
        setStatus(true); applyServer(j);
        timer = setTimeout(poll, POLL_MS);
      })
      .catch(function () { setStatus(false); timer = setTimeout(poll, POLL_MS * 2); });
  }
  function stop() { clearTimeout(timer); S.connected = false; }
  function setStatus(ok) {
    S.connected = ok;
    var el = $('status'); if (!el) return;
    el.textContent = ok ? t('statusOk') : t('statusLost');
    el.className = 'chipstatus ' + (ok ? 'good' : 'warn');
  }
  function applyServer(j) {
    if (typeof j.rev === 'number') S.rev = j.rev;
    if (j.phase === 'stickers' || j.phase === 'actions' || j.phase === 'closed') S.phase = j.phase;
    if (Array.isArray(j.items)) {
      var by = RT.group(j.items), fresh = {}, known = {};
      ['q1', 'q2', 'q3', 'act'].forEach(function (k) { by[k].forEach(function (it) { known[it.id] = true; if (S.known && !S.known[it.id]) fresh[it.id] = true; }); });
      S.known = known; S.by = by;
      render(fresh);
    } else render({});
  }
  function connect() {
    pin = $('pinInput').value.trim();
    if (!net.configured()) { $('connMsg').textContent = t('noServer'); return; }
    if (!pin) return;
    $('connMsg').textContent = '';
    net.list(pin, -1)
      .then(function (j) {
        if (j && j.error === 'pin') { $('connMsg').textContent = t('pinWrong'); return; }
        if (!j || typeof j !== 'object') throw new Error('bad');
        S.rev = -1; S.known = null; showMain(); setStatus(true); applyServer(j); timer = setTimeout(poll, POLL_MS);
      })
      .catch(function () { $('connMsg').textContent = t('connErr'); });
  }
  function setPhase(p) { net.phase(pin, p).then(function () { poll(); }).catch(function () { }); }
  function removeItem(it) {
    if (!window.confirm(t('removeConfirm') + '\n' + it.t)) return;
    net.remove(pin, it.id).then(function () { poll(); }).catch(function () { });
  }
  function addAction() {
    var inp = $('ownInput'), txt = RT.clean(inp.value, LIMITS.action); if (!txt) return;
    net.add(pin, 'act', txt).then(function () { inp.value = ''; poll(); }).catch(function () { });
    inp.focus();
  }
  function startOver() {
    if (!window.confirm(t('startOverConfirm'))) return;
    net.reset(pin).then(function () { S.known = null; poll(); }).catch(function () { });
  }
  function fullscreen() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); }
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () { });
  }

  /* ---------- rendering ---------- */
  function noteList(items, cls, fresh) {
    var ul = h('ul', { class: 'notes' });
    if (!items.length) { ul.appendChild(h('li', { class: 'muted', text: t('noneYet') })); return ul; }
    items.forEach(function (it) {
      ul.appendChild(h('li', { class: 'note ' + cls + (fresh && fresh[it.id] ? ' new' : '') }, [
        h('span', { class: 'note-t', text: it.t }),
        h('button', { class: 'mini', type: 'button', 'aria-label': t('removeAria', { t: it.t }), onclick: function () { removeItem(it); }, text: '×' })]));
    });
    return ul;
  }
  function qcols(fresh) {
    var wrap = h('div', { class: 'qcols' });
    QUESTIONS.forEach(function (q) {
      wrap.appendChild(h('section', { class: 'card qcol ' + q.cls }, [
        h('h3', {}, [h('span', { class: 'qdot', 'aria-hidden': 'true' }), h('span', { text: q.text }), h('span', { class: 'cnt', text: String(S.by[q.k].length) })]),
        noteList(S.by[q.k], q.cls, fresh)]));
    });
    return wrap;
  }
  function render(fresh) {
    if (!$('stickerArea')) return;
    var p = S.phase;
    [['phase-stickers', 'stickers'], ['phase-actions', 'actions'], ['phase-closed', 'closed']].forEach(function (x) {
      $(x[0]).setAttribute('aria-pressed', p === x[1] ? 'true' : 'false');
    });
    $('phaseHint').textContent = t(p === 'stickers' ? 'phaseHintStickers' : p === 'actions' ? 'phaseHintActions' : 'phaseHintClosed');
    $('stickerArea').hidden = (p === 'actions');
    $('actionArea').hidden = (p === 'stickers');
    $('recap').hidden = (p !== 'actions');
    bd.update(S.by, fresh);
    var cols = $('qcolsHost'); cols.textContent = ''; cols.appendChild(qcols(fresh));
    var al = $('actList'); al.textContent = ''; al.appendChild(noteList(S.by.act, 'za', fresh));
    $('actCount').textContent = String(S.by.act.length);
    var rc = $('recapHost'); rc.textContent = ''; rc.appendChild(qcols({}));
  }

  function showConnect(errKey) {
    stop();
    var m = $('main'); m.textContent = '';
    var pinInput = h('input', { id: 'pinInput', class: 'inp', type: 'password', autocomplete: 'off', 'aria-describedby': 'connMsg',
      onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); connect(); } } });
    m.appendChild(h('section', { class: 'screen ready' }, [
      h('h1', { id: 'mTitle', tabindex: '-1', text: t('mConnectTitle') }),
      h('p', { class: 'lead', text: t('mConnectLead') }),
      h('label', { class: 'field', for: 'pinInput', text: t('pinLabel') }),
      h('div', { class: 'addrow' }, [pinInput, h('button', { class: 'btn', type: 'button', onclick: connect, text: t('connectBtn') })]),
      h('div', { class: 'hint err', id: 'connMsg', role: 'status', 'aria-live': 'polite', text: errKey ? t(errKey) : (net.configured() ? '' : t('noServer')) })
    ]));
    pinInput.focus();
  }

  function showMain() {
    var m = $('main'); m.textContent = '';
    bd = RT.board({ interactive: false });
    var joinUrl = location.protocol === 'file:' ? '' : location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '') + 'retro.html';
    function phaseBtn(id, key, p) { return h('button', { id: id, class: 'btn secondary', type: 'button', 'aria-pressed': 'false', onclick: function () { setPhase(p); }, text: t(key) }); }
    m.appendChild(h('section', { class: 'screen modscreen' }, [
      h('div', { class: 'toolbar' }, [
        h('span', { id: 'status', class: 'chipstatus good', role: 'status', text: t('statusOk') }),
        h('div', { class: 'seg', role: 'group', 'aria-label': t('phaseLabel') }, [
          phaseBtn('phase-stickers', 'phaseStickers', 'stickers'), phaseBtn('phase-actions', 'phaseActions', 'actions'), phaseBtn('phase-closed', 'phaseClosed', 'closed')]),
        h('button', { class: 'btn secondary', type: 'button', onclick: fullscreen, text: t('fullscreen') }),
        h('button', { class: 'btn secondary', type: 'button', onclick: function () { window.print(); }, text: t('print') }),
        h('button', { class: 'btn secondary', type: 'button', onclick: startOver, text: t('startOver') })]),
      h('p', { id: 'phaseHint', class: 'lead tight' }),
      joinUrl ? h('div', { class: 'card joinbar' }, [h('div', { class: 'qlabel', text: t('joinTitle') }), h('div', { class: 'joinurl', text: joinUrl })]) : null,
      h('div', { id: 'stickerArea' }, [bd.el, h('div', { id: 'qcolsHost' })]),
      h('div', { id: 'actionArea', hidden: true }, [
        h('h2', {}, [h('span', { text: t('actionsTitle') }), h('span', { class: 'cnt', id: 'actCount', text: '0' })]),
        h('div', { class: 'addrow addown' }, [
          h('label', { class: 'sr', for: 'ownInput', text: t('addActionLabel') }),
          h('input', { id: 'ownInput', class: 'inp', type: 'text', maxlength: String(LIMITS.action), autocomplete: 'off', placeholder: t('addActionLabel'),
            onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); addAction(); } } }),
          h('button', { class: 'btn', type: 'button', onclick: addAction, text: t('addBtn') })]),
        h('div', { id: 'actList' })]),
      h('details', { id: 'recap', class: 'recap', hidden: true }, [h('summary', { text: t('recapTitle') }), h('div', { id: 'recapHost' })])
    ]));
    RT.syncFooter();
  }

  /* ---------- print: question lists and actions as plain text ---------- */
  function buildPrint() {
    var p = $('print'); p.textContent = '';
    p.appendChild(h('h1', { text: t('printTitle') }));
    QUESTIONS.forEach(function (q) {
      p.appendChild(h('h2', { text: q.text + ' (' + S.by[q.k].length + ')' }));
      var ul = h('ul'); S.by[q.k].forEach(function (it) { ul.appendChild(h('li', { text: it.t })); });
      p.appendChild(ul);
    });
    p.appendChild(h('h2', { text: t('actionsTitle') + ' (' + S.by.act.length + ')' }));
    var ua = h('ul'); S.by.act.forEach(function (it) { ua.appendChild(h('li', { text: it.t })); });
    p.appendChild(ua);
    p.appendChild(h('p', { class: 'disclaimer', text: t('printNote') }));
  }

  function build() {
    document.title = t('appName') + ' – Moderation';
    document.documentElement.lang = 'de';
    RT.initTheme();
    document.body.appendChild(RT.headerEl());
    document.body.appendChild(h('main', { id: 'main', class: 'wide' }));
    document.body.appendChild(h('div', { id: 'print' }));
    document.body.appendChild(RT.footerEl());
    RT.syncFooter(); window.addEventListener('resize', RT.syncFooter);
    window.addEventListener('beforeprint', buildPrint);
    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
      if ((e.key === 'f' || e.key === 'F') && $('stickerArea')) { e.preventDefault(); fullscreen(); }
    });
    showConnect();
  }
  build();
})();

</script>
